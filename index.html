<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container" role="main">
    <div class="card">
      <h1 class="title">Countdown Timer</h1>

      <div class="display-wrapper progress-ring">
        <svg class="progress-ring__track" viewBox="0 0 100 100">
          <circle class="progress-ring__background" cx="50" cy="50" r="45"></circle>
        </svg>
        <svg class="progress-ring__circle" viewBox="0 0 100 100">
          <circle class="progress-ring__bar" cx="50" cy="50" r="45"></circle>
        </svg>
        <div class="display" id="display" aria-live="polite" aria-atomic="true"><span class="display-content">00:00:00</span></div>
      </div>

      <form class="inputs" id="inputs-form" autocomplete="off">
        <div class="input-group">
          <label for="hours">Hours</label>
          <input
            type="number"
            id="hours"
            name="hours"
            min="0"
            max="99"
          />
        </div>
        <div class="input-group">
          <label for="minutes">Minutes</label>
          <input
            type="number"
            id="minutes"
            name="minutes"
            min="0"
            max="59"
          />
        </div>
        <div class="input-group">
          <label for="seconds">Seconds</label>
          <input
            type="number"
            id="seconds"
            name="seconds"
            min="0"
            max="59"
          />
        </div>
        <button type="button" class="btn btn--secondary" id="set-btn">Set Timer</button>
      </form>

      <div class="controls">
        <button type="button" class="btn btn--primary" id="start-btn">Start</button>
        <button type="button" class="btn" id="pause-btn">Pause</button>
        <button type="button" class="btn btn--secondary" id="reset-btn">Reset</button>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
